# Levanta el portal completo con un comando: docker compose up --build
# Front en http://localhost:5173 · Gateway (CORE falso) en http://localhost:4000
# Para usar el mock del contrato en lugar del BFF:
#   COMPOSE_STUDENT_SERVICE_URL=http://prism:4010 docker compose up --build
# (variable propia: compose lee el .env de la raíz, cuyo STUDENT_SERVICE_URL es para npm run dev)

x-modulos: &modulos
  PREFIJO_DOCENTE: /api/v1/teacher
  PREFIJO_COMEDOR: /api/v1/dining
  PREFIJO_TIENDA: /api/v1/store
  PREFIJO_EVENTOS: /api/v1/events
  PREFIJO_BACKOFFICE: /api/v1/backoffice
  PREFIJO_ACADEMICO: /api/v1/academic

services:
  core-falso:
    build: { context: ., dockerfile: apps/core-falso/Dockerfile }
    ports: ['4000:4000']
    environment:
      CORE_PORT: 4000
      JWT_ISSUER: http://localhost:4000
      JWT_AUDIENCE: uadenet
      STUDENT_SERVICE_URL: ${COMPOSE_STUDENT_SERVICE_URL:-http://bff:3000/api/v1}
      WEB_ORIGIN: http://localhost:5173
      # Fallas simuladas al arrancar, por ejemplo dining:caido (ver docs/instalacion.md)
      CORE_FALLAS: ${CORE_FALLAS:-}

  bff:
    build: { context: ., dockerfile: apps/bff/Dockerfile }
    ports: ['3000:3000']
    environment:
      <<: *modulos
      BFF_PORT: 3000
      GATEWAY_URL: http://core-falso:4000
      JWKS_URL: http://core-falso:4000/.well-known/jwks.json
      JWT_ISSUER: http://localhost:4000
      JWT_AUDIENCE: uadenet
    depends_on: [core-falso]

  prism:
    image: stoplight/prism:5
    # La imagen solo existe para amd64 (en Mac con Apple Silicon corre emulada) y su modo
    # multiproceso falla al arrancar
    platform: linux/amd64
    command: mock -h 0.0.0.0 -p 4010 --multiprocess=false /contrato/openapi.yaml
    volumes: ['./openapi.yaml:/contrato/openapi.yaml:ro']
    ports: ['4010:4010']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GATEWAY_URL: http://localhost:4000
        VITE_NOTIFICATIONS_URL: http://localhost:4000/notifications
    ports: ['5173:80']
    depends_on: [core-falso]
