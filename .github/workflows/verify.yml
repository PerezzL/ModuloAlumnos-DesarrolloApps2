name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  docker:
    # Construye las imágenes y levanta el stack completo, para que un Dockerfile roto se note
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar docker compose
        run: docker compose up -d --build
      - name: Smoke test
        run: scripts/smoke-docker.sh
      - name: Bajar
        if: always()
        run: docker compose down
